services:
  # Servicio 1: Base de datos PostgreSQL
  db:
    image: postgres:17-alpine
    container_name: fglab_postgres
    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    ports:
      - "5432:${DATABASE_PORT}"
    volumes:
      - ./postgres/backup_labmem.sql:/docker-entrypoint-initdb.d/backup_labmem.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER} -d ${DATABASE_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Servicio 2: API de FastAPI
  api:
    build:
      context: ./fastapi-crud
      dockerfile: Dockerfile
    container_name: fglab_fastapi
    restart: always
    ports:
      - "8000:8000"
    environment:
      DATABASE_USER: ${DATABASE_USER}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      DATABASE_NAME: ${DATABASE_NAME}
      DATABASE_HOST: db
      DATABASE_PORT: ${DATABASE_PORT}
    depends_on:
      db:
        condition: service_healthy  # Espera a que Postgres esté 100% listo para responder consultas

  # Servicio 3: Frontend en Vite + React compilado en NGINX (Producción)
  frontend:
      profiles: ["prod"]
      build:
        context: ./fastapi-frontend
        dockerfile: Dockerfile
      container_name: fglab_frontend 

  # Servicio 3: Frontend en Vite + React (Development)
  frontend-dev:
    profiles: ["dev"]
    build:
      context: ./fastapi-frontend
      dockerfile: Dockerfile.dev
    container_name: fglab_frontend_dev
    ports:
      - "5173:5173"
    environment:
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - ./fastapi-frontend:/app
      - /app/node_modules
    depends_on:
      - api
